function brusselsInstant(day,time) {

 const fmt=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Brussels',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});

  const p=Object.fromEntries(fmt.formatToParts(new Date(utc)).map(x=>[x.type,x.value]));
  const displayed=Date.parse(`${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}Z`);
  const delta=local-displayed;if(!delta)return new Date(utc).toISOString();utc+=delta;
 }
 throw Error('NONEXISTENT_LOCAL_TIME');
}

 function capacityNotice(s){return s.extendedSession&&s.evening.registrationStatus==='OPEN'&&s.policy.capacityOverride===null?warning('Bij 12 spelers op 2 pleinen spelen we tot '+s.extendedEndTime+'. De speelvariant volgt bij afsluiten.'):s.extendedSession?warning('Pleincapaciteit beperkt: 12 spelers · 2 pleinen · speelduur verlengd tot '+s.extendedEndTime):s.policy.capacity<12?warning('Inschrijvingscapaciteit beperkt: '+s.policy.capacity+' spelers · '+s.policy.confirmedCourts+' plein'+(s.policy.confirmedCourts===1?'':'en')):'';}
 function bookingDateNotice(t){const n=[...(data.notifications??[])].reverse().find(n=>n.type==='BOOKING_SESSION_CHANGED'&&n.targetDate===t.targetDate&&n.reopened?.some(r=>r.bookingTaskId===t.bookingTaskId));const old=n?.reopened.find(r=>r.bookingTaskId===t.bookingTaskId);return n&&t.status==='PENDING'?warning((n.changedByName??name(n.changedByPlayerId))+' heeft het speelmoment gewijzigd naar '+n.targetDate+' om '+n.startTime+'. '+(old.removed?'Je eerdere boekingsregistratie is verwijderd. ':'')+'Rond je boeking '+(old.removed?'opnieuw ':'')+'af voor het nieuwe speelmoment.'+(old.wasBooked?' Annuleer je oude reservatie bij de club als dat nog nodig is.':'')):'';}
 function financeSummary(f){if(!f)return warning('Financiële gegevens niet beschikbaar.');return `<p class="balance-value">€ ${f.balance.toFixed(2)}</p>${f.balance<=0?warning(f.balance<0?'Vul je voorschot aan en verwittig Demo-speler-01.':'Vul je voorschot aan en verwittig Demo-speler-01.'):notice('Je voorschot is op peil.')}`;}
 function bookingRevision(t){const n=[...(data.notifications??[])].reverse().find(n=>n.type==='BOOKING_SESSION_CHANGED'&&n.targetDate===t.targetDate&&n.reopened?.some(r=>r.bookingTaskId===t.bookingTaskId));return n?.reopened.find(r=>r.bookingTaskId===t.bookingTaskId);}
 function playerActions(){const clock=Date.parse(data.testReview?.clock??new Date().toISOString()),rows=[];
 const row=(kind,label,action,id,date,time)=>`<button class="action-link" data-action="${action}" data-id="${esc(id)}" data-task-kind="${kind}"><span>${date?`<small>${esc(date)} · ${esc(time)}</small>`:''}<strong>${esc(label)}</strong></span><span aria-hidden="true">→</span></button>`;
 const s=data.slots[0];if(s.canRegister&&(!s.registration?.choice||s.registration.choice==='NO_ANSWER'))rows.push(row('registration',s.participants.length>=s.policy.capacity?'Meld je aan als reserve':'Schrijf je in','choose',s.evening.eveningId,s.evening.date,s.evening.startTime));
 for(const t of data.tasks.filter(t=>t.status==='PENDING'&&t.opensAt&&clock>=Date.parse(t.opensAt)&&!t.pendingAgreement)){const s=data.slots.find(s=>s.evening.date===t.targetDate);rows.push(bookingDateNotice(t)+row('booking',bookingRevision(t)?.wasBooked?'Boek opnieuw':'Rond je boeking af','mineBooking',t.bookingTaskId,t.targetDate,s?.evening.startTime??''));}
 if(data.finance&&data.finance.balance<=0)rows.push(warning('Vul je voorschot aan en verwittig Demo-speler-01.')+`<button class="action-link" data-tab="Voorschot" data-task-kind="funding"><strong>Bekijk je ballenvoorschot</strong><span aria-hidden="true">→</span></button>`);
 return rows.length?`<section class="panel home-section personal-actions"><h3>Jouw acties</h3>${rows.join('')}</section>`:'';
 }

 function home(){
  const clock=Date.parse(data.testReview?.clock??new Date().toISOString());
  const dayLabel=day=>new Date(day+'T12:00:00Z').toLocaleDateString('nl-BE',{day:'numeric',month:'long',timeZone:'Europe/Brussels'});
  const followingDay=day=>new Date(Date.parse(day+'T12:00:00Z')+86400000).toISOString().slice(0,10);
  const rows=data.slots.map((s,index)=>{
   const own=data.tasks.find(t=>t.targetDate===s.evening.date),released=Boolean(s.bookings[0]?.opensAt&&clock>=Date.parse(s.bookings[0].opensAt));
   const closed=s.evening.registrationStatus!=='OPEN',count=s.participants.length+'/'+s.policy.capacity+' spelers'+(s.reserves.length?' · '+s.reserves.length+' reserves':'');
   const registered=s.registration?.choice&&s.registration.choice!=='NO_ANSWER';
   const ownStatus=s.replacedBy?'Je bent vervangen door '+name(s.replacedBy):s.registrationChangedBy&&s.registration.choice==='PLAY'?s.registrationChangedBy+' heeft je toegevoegd':s.registration?.choice==='PLAY'?closed?'Jouw deelname is bevestigd':'Jij speelt mee':s.registration?.choice==='RESERVE'?'Jij staat reserve':'Jij speelt niet mee';
   const personal=own&&(own.status!=='PENDING'||released)?button(own.status==='PENDING'?'Jouw boekingsopdracht staat open.':own.status==='BOOKED'?'Jouw boeking · Gelukt · Plein '+own.booking?.court:'Jouw boeking · Gefaald','mineBooking',`class="home-link" data-id="${esc(own.bookingTaskId)}"`):'';
   const open=s.bookings.filter(t=>t.status==='PENDING').length,courts=s.bookings.filter(t=>t.booking).map(t=>t.booking.court).sort((a,b)=>a-b),failed=s.bookings.filter(t=>t.status==='NOT_BOOKED').length;
   const bookingText=open?`${open} Open · ${courts.length} Gelukt · ${failed} Gefaald`:`${courts.length} pleinen geboekt${courts.length?' · Pleinen '+courts.join(', '):''}`;
   const showSummary=!(open===3&&index>0),inspect=released||s.bookings.some(t=>t.status!=='PENDING');
   return `<div class="schedule-row"><div class="schedule-date">${esc(new Date(s.evening.date+'T12:00:00Z').toLocaleDateString('nl-BE',{day:'numeric',month:'short',timeZone:'Europe/Brussels'}))}<small>${esc(s.evening.startTime)}</small></div><div class="schedule-status"><div class="registration-summary"><strong>Inschrijving ${closed?'gesloten':'open'}</strong><div class="schedule-meta registration-count">${index===0&&(!closed||s.participants.length)?button(count,'showPlayers',`class="home-link" data-id="${esc(s.evening.eveningId)}"`):esc(count)}</div>${index?`<p class="schedule-meta">Inschrijving kan vanaf ${esc(dayLabel(followingDay(data.slots[index-1].evening.date)))}</p>`:''}${index===0&&registered?`<div class="schedule-own">${button(ownStatus,'choose',`class="home-link" data-id="${esc(s.evening.eveningId)}"`)}</div>`:''}${s.sessionChanged?notice('Speelmoment gewijzigd'):''}${(data.notifications??[]).filter(n=>n.targetDate===s.evening.date&&n.type!=='BOOKING_SESSION_CHANGED').map(n=>notice(n.type==='LINEUP_CHANGED'?'Opstelling gewijzigd':n.after===data.actor.playerId?'Jij bent aangewezen als pleinboeker':'Je boekingsopdracht is overgenomen door '+(n.afterName??name(n.after)))).join('')}${capacityNotice(s)}${s.assignment?button('Pleinopstelling','lineup',`class="home-link" data-id="${esc(s.evening.eveningId)}"`):''}${(index===0||s.policy.reason==='SESSION_CHANGE_PENDING')&&s.policy.registrationBlocked?warning(s.policy.reason==='BOOKINGS_OPEN'?'Boekingsopdrachten nog niet afgesloten.':errorNames[s.policy.reason]):''}</div><div class="booking-summary"><strong>Pleinboekingen</strong>${showSummary?`<div class="schedule-meta">${inspect?button(bookingText,'allBookings',`class="home-link" data-id="${esc(s.evening.eveningId)}"`):esc(bookingText)}</div>`:''}${personal}${open&&!personal?`<p class="schedule-meta">${released?'Pleinboeken is nu mogelijk.':'Boeken mogelijk na publicatie van de pleinopstelling.'}</p>`:''}</div></div></div>`;
  }).join('');
  return personalActions()+`<section class="panel home-section"><div class="home-head title-only"><h3>Mijn planning</h3></div>${rows}</section><section class="panel home-section"><div class="home-head"><h3>Ballenvoorschot</h3>${homeLink('Historiek','Voorschot')}</div>${financeSummary(data.finance)}</section>`;
 }

 function playerSubnav(){const active=tab;return `<nav class="detail-nav" aria-label="Spelersplanning">${[['Inschrijving','Mijn inschrijving'],['Deelnemers','Wie speelt mee?'],['Opstelling','Pleinopstelling']].map(([key,label])=>`<button data-tab="${key}" class="${active===key?'selected':''}" aria-pressed="${active===key}">${label}</button>`).join('')}</nav>`;}
 function labelChoice(c){return {PLAY:'Spelen',NO:'Kan niet',RESERVE:'Reserve',NO_ANSWER:'Geen antwoord'}[c]??'Geen antwoord';}
 function registration(){const s=slot(),open=s.canRegister;return playerSubnav()+card('Mijn inschrijving',selector()+`<p class="spaced">${s.participants.length}/${s.policy.capacity} spelers · ${s.evening.registrationStatus==='OPEN'?'open':'gesloten'}</p>${s.policy.registrationBlocked?warning(errorNames[s.policy.reason]):''}<p class="personal-status">Mijn antwoord: ${esc(s.replacedBy?'Je bent vervangen door '+name(s.replacedBy):s.registrationChangedBy&&s.registration?.choice==='PLAY'?s.registrationChangedBy+' heeft je toegevoegd':labelChoice(s.registration?.choice))}</p><div class="choices">${['PLAY','NO','RESERVE'].map(c=>button({PLAY:'Ik speel mee',NO:'Ik kan niet',RESERVE:'Reserve'}[c],'register',`data-choice="${c}" class="${s.registration?.choice===c?'selected':''}" aria-pressed="${s.registration?.choice===c}" ${open&&(c!=='PLAY'||s.registration?.choice==='PLAY'||s.participants.length<s.policy.capacity)?'':'disabled'}`)).join('')}</div>${s.extendedSession?`<label class="check"><input id="late-availability" type="checkbox" ${s.canPlayUntil2230?'checked':''} ${s.canSetLateAvailability?'':'disabled'}> Ik kan spelen tot ${esc(s.extendedEndTime)}</label>`:''}<p class="muted spaced">${open?'Je keuze wordt meteen opgeslagen.':'De inschrijving is momenteel niet beschikbaar.'}</p>`);}
 function participants(){const s=slot();return playerSubnav()+card('Wie speelt mee?',selector()+(s.lineupChanged?notice('De deelnemers en opstelling zijn gewijzigd sinds de eerdere publicatie.'):'')+`<div class="totals"><span class="badge">${s.participants.length} deelnemers</span><span class="badge">${s.bookings.filter(t=>t.booking).length} pleinen geboekt</span></div>`+s.participants.slice().sort(alphaNames).map((p,i)=>`<div class="row"><span>${i+1}. ${esc(p.name)}${p.playerId===data.actor.playerId?' · jij':''}</span>${s.extendedSession?`<small>${s.evening.registrationStatus==='CLOSED'?'Bevestigd':'Ingeschreven'} · ${p.canPlayUntil2230?'kan tot '+esc(s.extendedEndTime)+' spelen':'kan maar tot '+esc(s.normalEndTime)+' spelen'}</small>`:''}</div>`).join(''))+card('Reserves · op volgorde',s.reserves.map((p,i)=>`<div class="row"><span>${i+1}. ${esc(p.name)}${p.playerId===data.actor.playerId?' · jij':''}</span></div>`).join('')||'<p class="muted spaced">Geen reserves.</p>');}
 function playerLineup(){return playerSubnav()+card('Pleinopstelling',selector()+lineup(slot()));}
 const clubStartField=(id,selected)=>`<label for="${id}">Startuur</label><select id="${id}">${['08:30','10:00','11:30','13:00','14:30','16:00','17:30','19:00','20:30','22:00'].map(t=>`<option value="${t}" ${t===selected?'selected':''}>${t}</option>`).join('')}</select>`;
 const bookingCopy='Je mag al boeken zodra de pleinopstelling gepubliceerd is. Controleer bij de club welke namen uit jouw adviserende lijst beschikbaar zijn. Is je eigen naam niet beschikbaar voor de clubboeking? Laat dan iemand anders het plein boeken. Registreer hier het geboekte pleinnummer of geef aan waarom boeken niet lukte. Meld ook een ander speelmoment dat je met de overige boekers hebt afgesproken.';
 const bookingStatus=t=>t.booking?'Gelukt · Plein '+t.booking.court+' · geboekt':t.status==='NOT_BOOKED'?'Gefaald · Boeken niet gelukt · '+({NO_COURT_AVAILABLE:'Geen plein beschikbaar',INSUFFICIENT_PLAYERS:'Onvoldoende spelers',OTHER:'Andere reden'}[JSON.parse(t.notBookedReason||'{}').code]??'')+(JSON.parse(t.notBookedReason||'{}').detail?' · '+JSON.parse(t.notBookedReason).detail:''):'Open';
 function courts(){const nav=`<nav class="detail-nav two-tabs" aria-label="Pleinboeking"><button data-action="bookingTab" data-id="mine" class="${bookingTab==='mine'?'selected':''}">Mijn pleinboeking</button><button data-action="bookingTab" data-id="all" class="${bookingTab==='all'?'selected':''}">Alle pleinboekingen</button></nav>`;
 if(bookingTab==='all')return nav+card('Alle pleinboekingen',`<p class="muted">Laatst bijgewerkt om ${esc(lastReadAt)}</p>`+data.slots.map(s=>`<section class="spaced"><h4>${esc(s.evening.date)} · ${esc(s.evening.startTime)}</h4><p>${s.policy.confirmedCourts} plein(en) geboekt · inschrijvingslimiet ${s.policy.capacity}</p>${s.bookings.length?s.bookings.map(t=>`<div class="row"><span>${esc(t.ownerName)}<small${t.status==='NOT_BOOKED'?' class="negative"':''}>${t.status==='NOT_BOOKED'?'<strong>'+esc(bookingStatus(t))+'</strong>':esc(bookingStatus(t))}</small></span></div>`).join(''):'<p class="muted">Nog geen opdrachten beschikbaar.</p>'}${capacityNotice(s)}</section>`).join(''),`<button type="button" class="refresh-icon" data-action="refreshBookings" aria-label="Pleinboekingen vernieuwen" title="Pleinboekingen vernieuwen"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 13 3l1 3M4 12l1 3a8 8 0 0 0 13 3"/></svg></button>`);
 return nav+(data.tasks.length?data.tasks.map(t=>{const d=drafts[t.bookingTaskId]??{},open=Boolean(t.opensAt&&Date.parse(data.testReview?.clock??new Date().toISOString())>=Date.parse(t.opensAt));return card('Jouw pleinboekingsopdracht',`${bookingDateNotice(t)}`+`<p><strong>${esc(t.targetDate)}</strong></p><p>Jouw opdracht: boek één plein</p><p class="muted spaced">${bookingCopy}</p><details><summary>Jouw adviserende namenlijst</summary>${t.suggestions.slice().sort(alphaNames).map(p=>`<div>${esc(p.name)}</div>`).join('')}</details>${t.pendingAgreement?warning('Boekingsresultaat voor '+t.pendingAgreement.request?.proposedDate+' · '+t.pendingAgreement.request?.proposedStartTime+' wacht op bevestiging door de beheerder.'):t.status!=='PENDING'?`${t.status==='NOT_BOOKED'?urgent(bookingStatus(t)):`<p class="notice">${esc(bookingStatus(t))}</p>`}<p class="muted">Vraag de beheerder om een geregistreerd resultaat te corrigeren.</p>`:!open?warning('Boeken kan zodra de pleinopstelling gepubliceerd is.'):`<fieldset><legend>Boekingsresultaat</legend>${[['BOOKED','Plein geboekt'],['NOT_BOOKED','Boeken niet gelukt']].map(([v,l])=>`<label class="check"><input type="radio" name="outcome-${t.bookingTaskId}" data-booking="${t.bookingTaskId}" data-field="outcome" value="${v}" ${d.outcome===v?'checked':''}>${l}</label>`).join('')}</fieldset>${d.outcome==='BOOKED'?field('Werkelijk geboekt plein (1–7)','court-'+t.bookingTaskId,'number',d.court??''):d.outcome==='NOT_BOOKED'?`${warning('Namen nu bezet? Laat de opdracht open en probeer later opnieuw. Meld alleen een definitief mislukte boeking. Twee mislukte opdrachten beperken de capaciteit tot 4 spelers; drie tot 0.')}<label for="reason-${t.bookingTaskId}">Reden</label><select id="reason-${t.bookingTaskId}" data-booking="${t.bookingTaskId}" data-field="reason"><option value="">Kies een reden</option>${[['NO_COURT_AVAILABLE','Geen plein beschikbaar'],['INSUFFICIENT_PLAYERS','Onvoldoende spelers'],['OTHER','Andere reden']].map(([v,l])=>`<option value="${v}" ${d.reason===v?'selected':''}>${l}</option>`).join('')}</select>${d.reason==='OTHER'?field('Toelichting','detail-'+t.bookingTaskId,'text',d.detail??''):''}`:''}<label class="check"><input type="checkbox" id="other-${t.bookingTaskId}" data-booking="${t.bookingTaskId}" data-field="otherSession" ${d.otherSession?'checked':''}> Een ander speelmoment afgesproken</label>${d.otherSession?`<h4>Nieuw afgesproken speelmoment</h4>${field('Datum','date-'+t.bookingTaskId,'date',d.proposedDate??t.targetDate)}${clubStartField('time-'+t.bookingTaskId,d.proposedStartTime??'20:30')}<p class="muted">Bij bewaren wijzigt het gezamenlijke speelmoment. De andere twee opdrachten gaan opnieuw Open; hun eerdere resultaten vervallen.</p>`:''}${button('Boekingsresultaat bewaren','bookingResult',`data-id="${t.bookingTaskId}" ${d.outcome?'':'disabled'}`)}`}`);}).join(''):card('Mijn pleinboeking','<p>Je hebt geen persoonlijke boekingsopdracht. Bekijk Alle pleinboekingen voor het gezamenlijke overzicht.</p>'));}
 function finance(){const f=data.finance;return card('Ballenvoorschot',financeSummary(f)+(f?`<p>Cyclus: ${esc(f.cycle)}</p><h4 class="spaced">Laatste vijf afnames</h4>${f.deductions.length?f.deductions.map(t=>`<div class="row">${esc(t.at)} · ${esc(t.description??'Gebruik trainingsballen')}<span>€ ${Number(t.amount).toFixed(2)}</span></div>`).join(''):'<p class="muted">Nog geen afnames.</p>'}<h4 class="spaced">Laatste storting</h4><p>${f.lastDeposit?esc(f.lastDeposit.at)+' · € '+Number(f.lastDeposit.amount).toFixed(2):'Nog geen storting.'}</p>`:''));}

 function options(ids){ids=[...ids].sort((a,b)=>name(a).localeCompare(name(b),'nl-BE',{sensitivity:'base',numeric:true}));return '<option value="">— geen —</option>'+ids.map(id=>`<option value="${esc(id)}">${esc(name(id))}</option>`).join('');}
 function originalManagement(){const s=slot(),id=s.evening.eveningId;const players=s.participants.slice().sort(alphaNames).map(p=>p.playerId),c=data.admin.calculations[id],closed=s.evening.registrationStatus==='CLOSED',countOk=s.lineupPolicy?.valid??[4,8,12].includes(players.length),validCalculation=Boolean(c&&closed&&s.lineupPolicy.valid&&c.request.players.length===players.length&&c.request.players.every(p=>players.includes(p.playerId))&&c.request.playDate===s.evening.date&&(c.version===s.evening.version||!s.assignmentNeedsUpdate&&s.assignment));duoDrafts[id]??=c?.request?.fixedDuos??[];
 return card('Inschrijvingen beheren',selector()+`<p class="muted" data-session-statuses>Inschrijving: ${s.evening.registrationStatus==='OPEN'?'Open':'Gesloten'} · Pleinopstelling: ${s.assignment?s.assignmentNeedsUpdate?'Bij te werken':'Gepubliceerd':validCalculation?'Berekend':'Nog niet berekend'} · Pleinboekingen: ${s.policy.pendingBookings} Open / ${s.policy.confirmedCourts} Gelukt / ${s.policy.failedBookings} Gefaald</p><p class="spaced">${esc(s.evening.registrationStatus)} · ${s.participants.length} deelnemers</p>${capacityNotice(s)}<label for="managePlayer">Speler corrigeren</label><select id="managePlayer">${options(data.admin.players.filter(p=>p.active).map(p=>p.playerId))}</select><label for="manageChoice">Antwoord</label><select id="manageChoice">${['PLAY','NO','RESERVE','NO_ANSWER'].map(c=>`<option value="${c}">${esc(labelChoice(c))}</option>`).join('')}</select>${button('Spelerantwoord opslaan','manageRegistration')}${twoCourtDecision()}<div class="admin-actions">${closed?button('Inschrijving openen','reopen',s.canOpen?'':'disabled'):button('Inschrijvingen afsluiten','close')}</div>${closed&&!countOk?warning('Pas het deelnemersaantal aan naar 4, 8 of 12 voordat je berekent.'):notice(closed?countOk?'Volgende stap: kies eventuele voorkeursduo’s en bereken.':'Pas het deelnemersaantal aan naar 4, 8 of 12 voordat je berekent.':'Controleer de deelnemers en sluit daarna de inschrijving af.')}<h4 class="spaced">Inschrijvingscapaciteit</h4><p class="muted">${s.policy.confirmedCourts} pleinen geboekt · ${s.policy.failedBookings} boekingen niet gelukt · ${s.policy.pendingBookings} opdrachten open. Automatisch: ${s.policy.automaticCapacity} plaatsen. Een keuze geldt alleen voor dit speelmoment.</p><label for="capacity">Capaciteit</label><select id="capacity"><option value="AUTO" ${s.policy.capacityOverride===null?'selected':''}>Automatisch (${s.policy.automaticCapacity})</option>${[0,4,...(s.policy.confirmedCourts===2&&(s.evening.registrationStatus==='OPEN'||s.polic
